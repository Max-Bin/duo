[project]
name = "duo"
version = "1.0.0"
description = "AI Agent Orchestration Runtime — tmux + file protocol to command coding agents"
readme = "README.md"
authors = [
    { name = "Max-Bin", email = "vborisw@gmail.com" }
]
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["agent", "orchestration", "copilot", "claude-code", "AI", "tmux", "automation", "parallel", "scheduler"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Software Distribution",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Environment :: Console",
    "Natural Language :: English",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=14.3.3",
]

[project.scripts]
duo = "duo.cli:main"

[project.urls]
Homepage = "https://github.com/Max-Bin/duo"
Repository = "https://github.com/Max-Bin/duo"
Documentation = "https://github.com/Max-Bin/duo#readme"
"Bug Tracker" = "https://github.com/Max-Bin/duo/issues"
Changelog = "https://github.com/Max-Bin/duo/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0",
    "ruff>=0.15.9",
    "coverage>=7.0",
    "hypothesis>=6.0",
    "mypy>=1.0",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--tb=short", "--strict-markers"]
filterwarnings = [
    "ignore::hypothesis.errors.NonInteractiveExampleWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["src/duo"]
omit = ["tests/*"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RET", "SIM", "PIE", "PERF", "FURB"]
ignore = ["E501", "E741", "E402", "RET504", "SIM102"]  # line length (formatter), ambiguous vars, conditional imports, unnecessary assign, nested ifs (often more readable)

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["F811", "SIM117", "PIE807"]  # same-named methods in different test classes, nested with, lambda default
