[project]
name = "duo"
version = "0.4.0"
description = "Agent Orchestration Runtime — Claude Code commands, Copilot CLI executes"
readme = "README.md"
authors = [
    { name = "Max-Bin", email = "vborisw@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
]

[project.scripts]
duo = "duo.cli:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
