[project]
name = "duo"
version = "0.5.0"
description = "Agent Orchestration Runtime — Commander 指挥，Executor 执行"
readme = "README.md"
authors = [
    { name = "Max-Bin", email = "vborisw@gmail.com" }
]
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["agent", "orchestration", "copilot", "automation", "tmux", "parallel", "scheduler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
    "Operating System :: POSIX",
    "Environment :: Console",
]
dependencies = [
    "click>=8.1",
    "rich>=14.3.3",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[project.scripts]
duo = "duo.cli:main"

[project.urls]
Homepage = "https://github.com/maxbin/duo"
Repository = "https://github.com/maxbin/duo"
Issues = "https://github.com/maxbin/duo/issues"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.9",
    "coverage>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["src/duo"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RET"]
ignore = ["E501", "E741", "E402", "RET504"]  # line length (formatter), ambiguous vars, conditional imports, unnecessary assign
