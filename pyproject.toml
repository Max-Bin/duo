[project]
name = "duo"
version = "0.4.0"
description = "Agent Orchestration Runtime — Commander 指挥，Executor 执行"
readme = "README.md"
authors = [
    { name = "Max-Bin", email = "vborisw@gmail.com" }
]
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["agent", "orchestration", "copilot", "automation", "tmux", "parallel", "scheduler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
    "Operating System :: POSIX",
    "Environment :: Console",
]
dependencies = [
    "click>=8.1",
    "rich>=14.3.3",
]

[project.scripts]
duo = "duo.cli:main"

[project.urls]
Homepage = "https://github.com/user/duo"
Repository = "https://github.com/user/duo"
Issues = "https://github.com/user/duo/issues"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
