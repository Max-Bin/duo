# Duo Batch 任务示例
#
# 用法: duo batch examples/tasks.yaml --repo /path/to/your/project
#
# 每个任务会自动创建 git worktree 和 Copilot 会话。
# 超过并发上限（默认 3）的任务会进入 FIFO 队列。

tasks:
  - name: auth-module
    description: 实现 JWT 用户认证模块，包括 login/logout/refresh 端点
    target_files:
      - src/auth.py
      - src/models/user.py
    writable_paths:
      - src/auth.py
      - src/models/*
      - tests/test_auth.py

  - name: api-routes
    description: 实现 REST API 路由，包括 CRUD 端点和参数校验
    target_files:
      - src/routes.py
    writable_paths:
      - src/routes.py
      - src/schemas/*
      - tests/test_routes.py

  - name: db-migrations
    description: 创建数据库迁移脚本，初始化用户表和任务表
    target_files:
      - migrations/
    writable_paths:
      - migrations/*
      - src/models/*
